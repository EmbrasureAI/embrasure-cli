name: Windows 11 live acceptance

on:
  push:
    branches: [estimate-windows-installer]
    paths: [.github/workflows/windows-11-live-acceptance.yml]

permissions:
  actions: read
  contents: read

jobs:
  live-snowflake:
    runs-on: windows-11-arm
    timeout-minutes: 25
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.WIN_E2E_SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.WIN_E2E_SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.WIN_E2E_SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.WIN_E2E_SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.WIN_E2E_SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_PRODUCTION_SCHEMA: ${{ secrets.WIN_E2E_SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_OAUTH_TOKEN: ${{ secrets.WIN_E2E_SNOWFLAKE_OAUTH_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the Windows 11 host
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          if ($os.Caption -notmatch 'Windows 11') {
            throw "Expected Windows 11; got $($os.Caption)."
          }
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') {
            throw "Expected the hosted Windows 11 Arm runner; got $env:PROCESSOR_ARCHITECTURE."
          }
          Write-Output "$($os.Caption) $($os.Version) build $($os.BuildNumber)"
      - name: Download the green release-candidate package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 32541684918 `
            --repo EmbrasureAI/embrasure-cli `
            --name windows-acceptance-test `
            --dir (Join-Path $env:RUNNER_TEMP 'release-candidate')
      - name: Install the exact release candidate
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'release-candidate'
          $archive = @(Get-ChildItem `
            -LiteralPath $artifactRoot `
            -Filter 'embrasure-*-x86_64-pc-windows-msvc.zip' `
            -File)
          if ($archive.Count -ne 1) { throw "Expected one x64 ZIP; found $($archive.Count)." }
          $hash = (Get-FileHash -LiteralPath $archive[0].FullName -Algorithm SHA256).Hash
          & (Join-Path $artifactRoot 'install.ps1') `
            -Version 0.5.3 `
            -ArchivePath $archive[0].FullName `
            -ExpectedSha256 $hash `
            -Quiet
          if ($LASTEXITCODE -ne 0) { throw "Installer exited with $LASTEXITCODE." }
          $binary = Join-Path $env:LOCALAPPDATA 'Programs\Embrasure\bin\embrasure.exe'
          if ((& $binary --version | Out-String).Trim() -ne 'embrasure 0.5.3') {
            throw 'The installed executable reported the wrong version.'
          }
      - name: Install the dbt project prerequisites
        shell: pwsh
        run: |
          $pythonRoot = Join-Path $env:RUNNER_TEMP 'python-3.12-x64'
          $pythonInstaller = Join-Path $env:RUNNER_TEMP 'python-3.12.10-amd64.exe'
          Invoke-WebRequest `
            -UseBasicParsing `
            -Uri 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe' `
            -OutFile $pythonInstaller
          $signature = Get-AuthenticodeSignature -LiteralPath $pythonInstaller
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -notmatch 'Python Software Foundation') {
            throw 'The Python x64 installer does not have the expected valid publisher signature.'
          }
          $install = Start-Process `
            -FilePath $pythonInstaller `
            -ArgumentList @(
              '/quiet', 'InstallAllUsers=0', "TargetDir=${pythonRoot}",
              'PrependPath=0', 'Include_launcher=0', 'Include_test=0'
            ) `
            -Wait `
            -PassThru
          if ($install.ExitCode -ne 0) { throw "Python x64 installation exited with $($install.ExitCode)." }
          $python = Join-Path $pythonRoot 'python.exe'
          & $python -m pip install --disable-pip-version-check 'dbt-core==1.11.8' 'dbt-snowflake==1.11.4'
          if ($LASTEXITCODE -ne 0) { throw 'Could not install dbt prerequisites.' }
          $scripts = Join-Path $pythonRoot 'Scripts'
          $scripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $pythonRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $scripts 'dbt.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'dbt is not runnable.' }
      - name: Run a real Snowflake pass and finding journey
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'Embrasure Windows 11 Snowflake ü'
          $models = Join-Path $project 'models'
          New-Item -ItemType Directory -Path $models -Force | Out-Null
          @"
          name: embrasure_win11_e2e
          version: 1.0.0
          config-version: 2
          profile: embrasure_win11_e2e
          model-paths: [models]
          models:
            embrasure_win11_e2e:
              +materialized: table
          "@ | Set-Content -LiteralPath (Join-Path $project 'dbt_project.yml') -Encoding utf8
          @"
          embrasure_win11_e2e:
            target: acceptance
            outputs:
              acceptance:
                type: snowflake
                account: $env:SNOWFLAKE_ACCOUNT
                user: $env:SNOWFLAKE_USER
                role: $env:SNOWFLAKE_ROLE
                database: $env:SNOWFLAKE_DATABASE
                warehouse: $env:SNOWFLAKE_WAREHOUSE
                schema: $env:SNOWFLAKE_PRODUCTION_SCHEMA
                authenticator: oauth
                token: "{{ env_var('SNOWFLAKE_OAUTH_TOKEN') }}"
                threads: 2
                client_session_keep_alive: false
          "@ | Set-Content -LiteralPath (Join-Path $project 'profiles.yml') -Encoding utf8
          @"
          version: 1
          dbt:
            project_dir: .
            profile: embrasure_win11_e2e
            command: dbt
            threads: 2
          safety:
            schema_prefix: EMBRASURE_WIN11_E2E
            statement_timeout_seconds: 120
            max_models: 5
          accounts:
            - name: acceptance
              account: $env:SNOWFLAKE_ACCOUNT
              user: $env:SNOWFLAKE_USER
              role: $env:SNOWFLAKE_ROLE
              database: $env:SNOWFLAKE_DATABASE
              warehouse: $env:SNOWFLAKE_WAREHOUSE
              production_schema: $env:SNOWFLAKE_PRODUCTION_SCHEMA
              auth: { type: oauth, token_env: SNOWFLAKE_OAUTH_TOKEN }
          models:
            model.embrasure_win11_e2e.orders:
              primary_key: [order_id]
          "@ | Set-Content -LiteralPath (Join-Path $project 'embrasure-check.yml') -Encoding utf8
          @'
          version: 2
          models:
            - name: orders
              columns:
                - name: order_id
                  data_tests: [unique, not_null]
          '@ | Set-Content -LiteralPath (Join-Path $models 'schema.yml') -Encoding utf8
          $baseline = @'
          select 1::number as order_id, 'paid'::varchar as status, 125.00::number(10, 2) as amount
          union all
          select 2::number as order_id, 'pending'::varchar as status, 75.50::number(10, 2) as amount
          '@
          Set-Content -LiteralPath (Join-Path $models 'orders.sql') -Value $baseline -Encoding utf8
          Push-Location $project
          try {
            git init -b main
            git config user.name 'Embrasure Windows Acceptance'
            git config user.email 'acceptance@embrasure.ai'
            git add -- dbt_project.yml profiles.yml embrasure-check.yml models/orders.sql models/schema.yml
            git commit -m 'Create production baseline'
            git switch -c acceptance
            Set-Content `
              -LiteralPath (Join-Path $models 'orders.sql') `
              -Value ("-- Equivalent SQL change`n" + $baseline) `
              -Encoding utf8
            git add -- models/orders.sql
            git commit -m 'Exercise equivalent SQL change'

            $binary = Join-Path $env:LOCALAPPDATA 'Programs\Embrasure\bin\embrasure.exe'
            $doctorJson = & $binary --config embrasure-check.yml doctor --read-only --json | Out-String
            if ($LASTEXITCODE -ne 0) {
              throw "Windows doctor failed: ${doctorJson}"
            }
            $doctor = $doctorJson | ConvertFrom-Json
            if (-not $doctor.ready) { throw "Windows doctor was not ready: ${doctorJson}" }
            $passJson = & $binary --config embrasure-check.yml check --base main --json | Out-String
            if ($LASTEXITCODE -ne 0) {
              throw "Equivalent change returned $LASTEXITCODE`: ${passJson}"
            }
            $pass = $passJson | ConvertFrom-Json
            if ($pass.status -ne 'pass' -or $pass.summary.findings -ne 0) {
              throw 'Equivalent change did not produce a clean pass.'
            }
            if (@($pass.ci_schemas | Where-Object { -not $_.cleaned_up }).Count -ne 0) {
              throw 'The passing run did not clean up its Snowflake schema.'
            }

            $changed = $baseline.Replace("'pending'", "'cancelled'").Replace('75.50', '5.50')
            Set-Content -LiteralPath (Join-Path $models 'orders.sql') -Value $changed -Encoding utf8
            git add -- models/orders.sql
            git commit -m 'Exercise material data change'
            $findingJson = & $binary --config embrasure-check.yml check --base main --json | Out-String
            $findingExit = $LASTEXITCODE
            if ($findingExit -ne 1) { throw "Material change returned $findingExit instead of 1." }
            $finding = $findingJson | ConvertFrom-Json
            if ($finding.status -ne 'findings' -or $finding.summary.findings -lt 1) {
              throw 'Material change did not produce findings.'
            }
            if (@($finding.ci_schemas | Where-Object { -not $_.cleaned_up }).Count -ne 0) {
              throw 'The findings run did not clean up its Snowflake schema.'
            }
          }
          finally {
            Pop-Location
          }
      - name: Remove the installed package
        if: always()
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'release-candidate\install.ps1'
          if (Test-Path -LiteralPath $installer -PathType Leaf) {
            & $installer -Uninstall -Quiet
          }
