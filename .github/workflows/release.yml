name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --require-hashes -r packaging/sqlglot-requirements.txt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package release binary
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="embrasure-${version}-${{ matrix.target }}"
          mkdir -p "dist/${package}"
          cp "target/${{ matrix.target }}/release/embrasure" "dist/${package}/embrasure"
          cp LICENSE NOTICE README.md SECURITY.md embrasure-check.example.yml "dist/${package}/"
          cp -R docs "dist/${package}/docs"
          mkdir -p "dist/${package}/python"
          python3 -m pip download \
            --only-binary=:all: \
            --no-deps \
            --require-hashes \
            --dest "dist/${package}/python" \
            -r packaging/sqlglot-requirements.txt
          test "$(find "dist/${package}/python" -maxdepth 1 -name 'sqlglot-*.whl' | wc -l | tr -d ' ')" = 1
          "dist/${package}/embrasure" --version | grep "embrasure ${version}"
          set +e
          "dist/${package}/embrasure" --config embrasure-check.example.yml doctor --read-only --json > "dist/${package}/doctor.json"
          doctor_status="$?"
          set -e
          test "${doctor_status}" -eq 3
          python3 - "dist/${package}/doctor.json" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          sqlglot = next(check for check in report["checks"] if check["check"] == "sqlglot")
          assert sqlglot["status"] == "pass", sqlglot
          assert sqlglot["message"] == "SQLGlot 30.7.0", sqlglot
          PY
          rm "dist/${package}/doctor.json"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          rm -rf "dist/${package}"
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/embrasure-${{ github.ref_name }}.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false
      - name: Generate checksums
        run: cd dist && sha256sum -- *.tar.gz *.spdx.json > SHA256SUMS
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Stage build provenance
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          test -s "${PROVENANCE_BUNDLE}"
          cp "${PROVENANCE_BUNDLE}" "dist/embrasure-${GITHUB_REF_NAME}.intoto.jsonl"
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/embrasure-${{ github.ref_name }}.spdx.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Embrasure ${GITHUB_REF_NAME}" \
            --generate-notes
      - name: Move the composite action major tag
        shell: bash
        run: |
          git tag --force v1 "${GITHUB_SHA}"
          git push origin refs/tags/v1 --force

  tap:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --pattern SHA256SUMS
      - name: Check out Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EmbrasureAI/homebrew-tap
          token: ${{ secrets.TAP_PUSH_TOKEN }}
          path: tap
      - name: Regenerate formula
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          checksum() { awk -v name="$1" '$2 == name { print $1 }' SHA256SUMS; }
          mac_arm="$(checksum "embrasure-${version}-aarch64-apple-darwin.tar.gz")"
          mac_intel="$(checksum "embrasure-${version}-x86_64-apple-darwin.tar.gz")"
          linux_arm="$(checksum "embrasure-${version}-aarch64-unknown-linux-gnu.tar.gz")"
          linux_intel="$(checksum "embrasure-${version}-x86_64-unknown-linux-gnu.tar.gz")"
          test -n "${mac_arm}${mac_intel}${linux_arm}${linux_intel}"
          mkdir -p tap/Formula
          sed \
            -e "s/@VERSION@/${version}/g" \
            -e "s/@MAC_ARM@/${mac_arm}/g" \
            -e "s/@MAC_INTEL@/${mac_intel}/g" \
            -e "s/@LINUX_ARM@/${linux_arm}/g" \
            -e "s/@LINUX_INTEL@/${linux_intel}/g" \
            .github/embrasure.rb.template > tap/Formula/embrasure.rb
          cd tap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/embrasure.rb
          git diff --cached --quiet || git commit -m "Update Embrasure to ${version}"
          git push
