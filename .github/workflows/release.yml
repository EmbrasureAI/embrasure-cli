name: Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'install.*'
      - 'packaging/**'
      - '.github/workflows/release.yml'
      - '.github/fortify.rb.template'
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  verify:
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag matches Cargo version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            test "${GITHUB_REF_NAME}" = "v${version}"
          fi
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --require-hashes -r packaging/sqlglot-requirements.txt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked

  build:
    needs: verify
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: Build release binary
        run: cargo build --release --locked --bin fortify --target "${{ matrix.target }}"
      - name: Package release binary
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          package="fortify-${version}-${{ matrix.target }}"
          mkdir -p "dist/${package}"
          cp "target/${{ matrix.target }}/release/fortify" "dist/${package}/fortify"
          cp "dist/${package}/fortify" "dist/${package}/embrasure"
          cp LICENSE NOTICE README.md SECURITY.md fortify-check.example.yml embrasure-check.example.yml "dist/${package}/"
          cp -R docs "dist/${package}/docs"
          mkdir -p "dist/${package}/python"
          python3 -m pip download \
            --only-binary=:all: \
            --no-deps \
            --require-hashes \
            --dest "dist/${package}/python" \
            -r packaging/sqlglot-requirements.txt
          test "$(find "dist/${package}/python" -maxdepth 1 -name 'sqlglot-*.whl' | wc -l | tr -d ' ')" = 1
          "dist/${package}/fortify" --version | grep "fortify ${version}"
          set +e
          "dist/${package}/fortify" --config fortify-check.example.yml doctor --read-only --json > "dist/${package}/doctor.json"
          doctor_status="$?"
          set -e
          test "${doctor_status}" -eq 3
          python3 - "dist/${package}/doctor.json" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          sqlglot = next(check for check in report["checks"] if check["check"] == "sqlglot")
          assert sqlglot["status"] == "pass", sqlglot
          assert sqlglot["message"] == "SQLGlot 30.7.0", sqlglot
          PY
          rm "dist/${package}/doctor.json"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          legacy="embrasure-${version}-${{ matrix.target }}"
          cp -R "dist/${package}" "dist/${legacy}"
          tar -C dist -czf "dist/${legacy}.tar.gz" "${legacy}"
          rm -rf "dist/${legacy}"
          rm -rf "dist/${package}"
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  build-windows:
    needs: verify
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate PowerShell sources with Windows PowerShell 5.1
        shell: powershell
        run: .\packaging\windows\Test-PowerShell.ps1
      - name: Validate PowerShell sources with PowerShell 7
        shell: pwsh
        run: .\packaging\windows\Test-PowerShell.ps1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned SQLGlot
        run: python -m pip install --require-hashes -r packaging/sqlglot-requirements.txt
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
      - name: Build Windows release binary
        run: |
          cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --all-features --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked --bin fortify --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows executable metadata
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          .\packaging\windows\Test-PeMetadata.ps1 -BinaryPath .\target\x86_64-pc-windows-msvc\release\fortify.exe -Version $version
      - name: Package and test Windows archive
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $package = "fortify-${version}-x86_64-pc-windows-msvc"
          $payload = Join-Path $pwd "dist\${package}"
          New-Item -ItemType Directory -Path .\dist | Out-Null
          .\packaging\windows\Stage-Payload.ps1 `
            -BinaryPath .\target\x86_64-pc-windows-msvc\release\fortify.exe `
            -OutputDirectory $payload
          $archive = Join-Path $pwd "dist\${package}.zip"
          Compress-Archive -LiteralPath $payload -DestinationPath $archive
          $legacyPayload = Join-Path (Join-Path $pwd "dist") "embrasure-${version}-x86_64-pc-windows-msvc"
          Copy-Item -LiteralPath $payload -Destination $legacyPayload -Recurse
          Compress-Archive -LiteralPath $legacyPayload -DestinationPath (Join-Path $pwd "dist\embrasure-${version}-x86_64-pc-windows-msvc.zip")
          Remove-Item -LiteralPath $legacyPayload -Recurse -Force
          .\packaging\windows\Test-Installer.ps1 `
            -ArchivePath $archive `
            -Version $version
          $manifests = Join-Path $env:RUNNER_TEMP 'windows-package-manifests'
          .\packaging\windows\New-PackageManifests.ps1 `
            -Version $version `
            -ArchiveSha256 (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash `
            -OutputDirectory $manifests
          Compress-Archive `
            -Path (Join-Path $manifests '*') `
            -DestinationPath (Join-Path $pwd "dist\fortify-${version}-windows-package-manifests.zip")
          Copy-Item -LiteralPath .\install.ps1 -Destination .\dist\install.ps1
          Remove-Item -LiteralPath $payload -Recurse -Force
      - name: Upload Windows release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  package:
    needs: [verify, build, build-windows]
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/fortify-${{ env.RELEASE_TAG }}.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false
      - name: Assert Windows release inventory
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          archive="dist/fortify-${version}-x86_64-pc-windows-msvc.zip"
          test -f "${archive}"
          test -f dist/install.ps1
          test -f "dist/fortify-${version}-windows-package-manifests.zip"
          test "$(unzip -Z1 "${archive}" | grep -cE '[/\\]libexec[/\\]fortify[/\\]python[/\\]sqlglot-30\.7\.0-py3-none-any\.whl$')" -eq 1
          test "$(unzip -Z1 "${archive}" | grep -cE '[/\\]bin[/\\]fortify\.exe$')" -eq 1
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.ps1' -o -name '*.spdx.json' \) \
            -print0 | sort -z | xargs -0 sha256sum | sed 's|  \./|  |' > SHA256SUMS
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/install.ps1
            dist/*.spdx.json
            dist/SHA256SUMS
      - name: Stage build provenance
        shell: bash
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          test -f "${PROVENANCE_BUNDLE}"
          cp "${PROVENANCE_BUNDLE}" "dist/fortify-${RELEASE_TAG}.intoto.jsonl"
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/install.ps1
          sbom-path: dist/fortify-${{ env.RELEASE_TAG }}.spdx.json
      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Fortify ${GITHUB_REF_NAME}" \
            --generate-notes
      - name: Move the composite action major tag
        shell: bash
        run: |
          git tag --force v1 "${GITHUB_SHA}"
          git push origin refs/tags/v1 --force

  tap:
    needs: [verify, publish]
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --pattern SHA256SUMS
      - name: Check out Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EmbrasureAI/homebrew-tap
          token: ${{ secrets.TAP_PUSH_TOKEN }}
          path: tap
      - name: Regenerate formula
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          checksum() { awk -v name="$1" '$2 == name { print $1 }' SHA256SUMS; }
          mac_arm="$(checksum "fortify-${version}-aarch64-apple-darwin.tar.gz")"
          mac_intel="$(checksum "fortify-${version}-x86_64-apple-darwin.tar.gz")"
          linux_arm="$(checksum "fortify-${version}-aarch64-unknown-linux-gnu.tar.gz")"
          linux_intel="$(checksum "fortify-${version}-x86_64-unknown-linux-gnu.tar.gz")"
          for checksum_value in "${mac_arm}" "${mac_intel}" "${linux_arm}" "${linux_intel}"; do
            [[ "${checksum_value}" =~ ^[0-9a-f]{64}$ ]]
          done
          mkdir -p tap/Formula
          sed \
            -e "s/@VERSION@/${version}/g" \
            -e "s/@MAC_ARM@/${mac_arm}/g" \
            -e "s/@MAC_INTEL@/${mac_intel}/g" \
            -e "s/@LINUX_ARM@/${linux_arm}/g" \
            -e "s/@LINUX_INTEL@/${linux_intel}/g" \
            .github/fortify.rb.template > tap/Formula/fortify.rb
          if grep -Eq '@[A-Z_]+@' tap/Formula/fortify.rb; then
            echo 'Homebrew formula contains an unresolved template token.' >&2
            exit 1
          fi
          cd tap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # Homebrew migrates existing installations instead of installing two conflicting formulae.
          rm -f Formula/embrasure.rb
          python3 - <<'PYRENAME'
          import json
          from pathlib import Path
          path = Path("formula_renames.json")
          renames = json.loads(path.read_text()) if path.exists() else {}
          renames["embrasure"] = "fortify"
          path.write_text(json.dumps(renames, indent=2) + "\n")
          PYRENAME
          git add Formula formula_renames.json
          git diff --cached --quiet || git commit -m "Update Fortify to ${version}"
          git push
