<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embrasure report</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17231f;
      --muted: #66736e;
      --line: #dce3df;
      --paper: #ffffff;
      --canvas: #f5f7f6;
      --green: #197454;
      --green-soft: #e7f5ef;
      --red: #bd493b;
      --red-soft: #fcedea;
      --amber: #a86b17;
      --amber-soft: #fff3dc;
      --blue: #3d649e;
      --blue-soft: #edf3fb;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; color: var(--ink); background: var(--canvas); }
    button { font: inherit; }
    .app { min-height: 100%; display: flex; flex-direction: column; }
    .topbar {
      min-height: 62px; display: flex; align-items: center; justify-content: space-between;
      gap: 24px; padding: 0 24px; color: #f7fbf8; background: #14241e;
    }
    .brand { font-size: 18px; font-weight: 650; letter-spacing: -.02em; }
    .run-base { min-width: 0; color: #b9c8c1; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .overview {
      display: flex; align-items: center; justify-content: space-between; gap: 24px;
      padding: 18px 24px; border-bottom: 1px solid var(--line); background: var(--paper);
    }
    .result { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .result-mark { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--green); }
    .result-mark.findings, .result-mark.execution_failure { background: var(--red); }
    .result-mark.incomplete { background: var(--amber); }
    .result-title { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.02em; }
    .result-copy { margin-top: 3px; color: var(--muted); font-size: 13px; }
    .metrics { display: flex; align-items: center; gap: 24px; flex: none; }
    .metric { display: grid; gap: 2px; }
    .metric strong { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .metric span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    .workspace { flex: 1; min-height: 560px; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
    .graph-panel { min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
    .panel-head {
      height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
      padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--paper);
    }
    .panel-head h2 { margin: 0; font-size: 14px; font-weight: 650; }
    .legend { display: flex; gap: 14px; color: var(--muted); font-size: 11px; }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .legend i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .legend .warn { background: var(--red); }
    .legend .scope { background: var(--blue); }
    .graph-viewport { position: relative; flex: 1; min-height: 500px; overflow: auto; background-color: var(--canvas); background-image: radial-gradient(#dbe2de 0.8px, transparent 0.8px); background-size: 20px 20px; }
    .graph-stage { position: relative; min-width: 100%; min-height: 100%; }
    .edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .edge { fill: none; stroke: #aab7b1; stroke-width: 1.5; }
    .edge.is-connected { stroke: var(--green); stroke-width: 2.2; }
    .node {
      position: absolute; width: 190px; min-height: 76px; padding: 12px 14px 11px 16px;
      text-align: left; color: var(--ink); background: var(--paper); border: 1px solid var(--line);
      border-left: 4px solid var(--green); border-radius: 7px; box-shadow: 0 2px 8px rgba(23,35,31,.06);
      cursor: pointer; transition: border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
    }
    .node:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(23,35,31,.1); }
    .node:focus-visible { outline: 3px solid rgba(25,116,84,.25); outline-offset: 2px; }
    .node.is-selected { border-color: var(--green); box-shadow: 0 0 0 3px rgba(25,116,84,.14), 0 5px 14px rgba(23,35,31,.1); }
    .node.findings, .node.execution_failure { border-left-color: var(--red); }
    .node.incomplete { border-left-color: var(--amber); }
    .node.impact { border-left-color: var(--blue); }
    .node-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 650; }
    .node-type { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .node-state { display: flex; align-items: center; gap: 5px; margin-top: 8px; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
    .node-state::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
    .node.findings .node-state::before, .node.execution_failure .node-state::before { background: var(--red); }
    .node.incomplete .node-state::before { background: var(--amber); }
    .node.impact .node-state::before { background: var(--blue); }
    .inspector { min-width: 0; background: var(--paper); overflow: auto; }
    .inspector-head { min-height: 92px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .eyebrow { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .07em; }
    .inspector h2 { margin: 6px 0 2px; font-size: 18px; line-height: 1.25; letter-spacing: -.02em; overflow-wrap: anywhere; }
    .inspector-subtitle { color: var(--muted); font-size: 12px; }
    .inspector-body { padding: 4px 20px 28px; }
    .detail-section { padding: 16px 0; border-bottom: 1px solid var(--line); }
    .detail-section:last-child { border-bottom: 0; }
    .detail-section h3 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    .detail-list { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
    .detail-list li { color: #34413c; font-size: 12px; line-height: 1.45; }
    .finding { padding: 9px 10px; color: #6f2f27; background: var(--red-soft); border-radius: 5px; }
    .gap { padding: 9px 10px; color: #6e4a15; background: var(--amber-soft); border-radius: 5px; }
    .facts { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; margin: 0; font-size: 12px; }
    .facts dt { color: var(--muted); }
    .facts dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    .flow { display: grid; grid-template-columns: minmax(0,1fr) 16px minmax(0,1fr); align-items: center; gap: 5px; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .flow span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .flow b { color: var(--muted); text-align: center; font-weight: 400; }
    .empty { color: var(--muted); font-size: 12px; line-height: 1.5; }
    @media (max-width: 820px) {
      .overview { align-items: flex-start; }
      .metrics { gap: 14px; }
      .workspace { grid-template-columns: 1fr; }
      .graph-panel { border-right: 0; }
      .graph-viewport { min-height: 480px; }
      .inspector { border-top: 1px solid var(--line); }
    }
    @media (max-width: 560px) {
      .topbar { padding: 0 16px; }
      .overview { padding: 15px 16px; flex-direction: column; gap: 15px; }
      .metrics { width: 100%; justify-content: space-between; }
      .panel-head { padding: 0 16px; }
      .legend { gap: 9px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">embrasure</div>
      <div class="run-base" id="run-base"></div>
    </header>
    <section class="overview" aria-labelledby="result-title">
      <div class="result">
        <span class="result-mark" id="result-mark" aria-hidden="true"></span>
        <div>
          <h1 class="result-title" id="result-title"></h1>
          <div class="result-copy" id="result-copy"></div>
        </div>
      </div>
      <div class="metrics" aria-label="Report summary">
        <div class="metric"><strong id="model-count">0</strong><span>models</span></div>
        <div class="metric"><strong id="finding-count">0</strong><span>findings</span></div>
        <div class="metric"><strong id="query-count">0</strong><span>queries</span></div>
      </div>
    </section>
    <section class="workspace">
      <div class="graph-panel">
        <header class="panel-head">
          <h2>Lineage impact</h2>
          <div class="legend" aria-label="Node status">
            <span><i></i>Passed</span><span><i class="warn"></i>Finding</span><span><i class="scope"></i>Impact only</span>
          </div>
        </header>
        <div class="graph-viewport" id="graph-viewport">
          <div class="graph-stage" id="graph-stage">
            <svg class="edges" id="edges" aria-hidden="true"></svg>
          </div>
        </div>
      </div>
      <aside class="inspector" aria-live="polite">
        <header class="inspector-head">
          <div class="eyebrow" id="inspector-eyebrow">Selected node</div>
          <h2 id="inspector-title">Select a lineage node</h2>
          <div class="inspector-subtitle" id="inspector-subtitle">Inspect comparison evidence and downstream impact.</div>
        </header>
        <div class="inspector-body" id="inspector-body"></div>
      </aside>
    </section>
  </main>
  <script>
    const report = __EMBRASURE_REPORT__;
    const values = value => Array.isArray(value) ? value : [];
    const impact = report.impact || {};
    const models = values(report.models);
    const queries = values(report.query_checks);
    const findings = values(report.findings);
    const gaps = values(report.coverage_gaps);
    const columnLineage = values(impact.column_lineage);
    const nodeMap = new Map();
    const edges = [];

    const addNode = (id, name, type, record = null) => {
      if (!id) return;
      const current = nodeMap.get(id);
      nodeMap.set(id, {
        id, name: name || current?.name || id, type: current?.type || type,
        record: record || current?.record || null
      });
    };
    values(impact.dbt_models).forEach(item => addNode(item.id, item.name, "model"));
    models.forEach(item => addNode(item.unique_id, item.name, "model", item));
    values(impact.dbt_exposures).forEach(item => addNode(item.id, item.name, "exposure", item));
    values(impact.dbt_lineage).forEach(edge => {
      addNode(edge.from, edge.from_name, "model");
      addNode(edge.to, edge.to_name, "model");
      edges.push({ from: edge.from, to: edge.to });
    });
    queries.forEach(query => {
      const id = `query:${query.name}`;
      addNode(id, query.name, "query", query);
      values(query.current_refs).forEach(ref => {
        const match = [...nodeMap.values()].find(node => node.id === ref || node.name === ref || node.id.endsWith(`.${ref}`));
        if (match) edges.push({ from: match.id, to: id });
      });
    });

    const nodes = [...nodeMap.values()];
    const modelFor = node => models.find(model => model.unique_id === node.id || model.name === node.name) || (node.type === "model" ? node.record : null);
    const findingsFor = node => findings.filter(item => item.model === node.id || item.model === node.name || item.model === `query:${node.name}`);
    const gapsFor = node => gaps.filter(item => item.scope === node.id || item.scope === node.name || item.scope === `query:${node.name}`);
    const statusFor = node => {
      if (findingsFor(node).length) return "findings";
      const nodeGaps = gapsFor(node);
      if (nodeGaps.length) return "incomplete";
      if (node.type === "query" && ["findings", "incomplete", "execution_failure"].includes(node.record?.status)) return node.record.status;
      const model = modelFor(node);
      if (model?.dbt_build === "failed") return "execution_failure";
      if (model?.comparison || node.type === "query" && node.record?.status === "pass") return "pass";
      return "impact";
    };
    const statusLabel = status => ({pass: "passed", findings: "finding", incomplete: "incomplete", execution_failure: "failed", impact: "impact only"})[status] || status;
    const typeLabel = type => ({model: "dbt model", query: "query check", exposure: "dbt exposure", dashboard: "dashboard"})[type] || type;
    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, character => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[character]);
    const formatNumber = value => Number(value ?? 0).toLocaleString();
    const formatPercent = value => `${(Number(value ?? 0) * 100).toFixed(1)}%`;

    document.getElementById("run-base").textContent = `compared with ${report.base || "production"}`;
    const overall = report.status || "pass";
    const mark = document.getElementById("result-mark");
    mark.className = `result-mark ${overall}`;
    document.getElementById("result-title").textContent = overall === "pass" ? "Safe to continue" : overall === "findings" ? "Review before merging" : overall === "incomplete" ? "Validation is incomplete" : "Validation failed";
    document.getElementById("result-copy").textContent = overall === "findings"
      ? `${findings.length} finding${findings.length === 1 ? "" : "s"} across the affected lineage.`
      : overall === "pass" ? "No unexpected differences were found." : "Open a node to see what needs attention.";
    document.getElementById("model-count").textContent = formatNumber(report.summary?.models_compared ?? models.length);
    document.getElementById("finding-count").textContent = formatNumber(findings.length);
    document.getElementById("query-count").textContent = formatNumber(queries.length);

    const levels = new Map(nodes.map(node => [node.id, 0]));
    const outgoing = new Map(nodes.map(node => [node.id, []]));
    const indegree = new Map(nodes.map(node => [node.id, 0]));
    edges.forEach(edge => {
      if (!outgoing.has(edge.from) || !indegree.has(edge.to)) return;
      outgoing.get(edge.from).push(edge.to);
      indegree.set(edge.to, indegree.get(edge.to) + 1);
    });
    const queue = nodes.filter(node => indegree.get(node.id) === 0).map(node => node.id);
    for (let index = 0; index < queue.length; index += 1) {
      const id = queue[index];
      outgoing.get(id).forEach(next => {
        levels.set(next, Math.max(levels.get(next), levels.get(id) + 1));
        indegree.set(next, indegree.get(next) - 1);
        if (indegree.get(next) === 0) queue.push(next);
      });
    }
    const grouped = new Map();
    nodes.forEach(node => {
      const level = levels.get(node.id) || 0;
      if (!grouped.has(level)) grouped.set(level, []);
      grouped.get(level).push(node);
    });
    grouped.forEach(group => group.sort((a, b) => a.name.localeCompare(b.name)));

    const positions = new Map();
    const maxLevel = Math.max(0, ...levels.values());
    const maxRows = Math.max(1, ...[...grouped.values()].map(group => group.length));
    const stage = document.getElementById("graph-stage");
    const viewport = document.getElementById("graph-viewport");
    const stageWidth = Math.max(viewport.clientWidth, 820, 110 + (maxLevel + 1) * 244);
    const stageHeight = Math.max(viewport.clientHeight, 500, 70 + maxRows * 114);
    stage.style.width = `${stageWidth}px`;
    stage.style.height = `${stageHeight}px`;

    let selectedId = null;
    grouped.forEach((group, level) => {
      const totalHeight = group.length * 114 - 38;
      const startY = Math.max(35, (stageHeight - totalHeight) / 2);
      group.forEach((node, row) => {
        const x = 52 + level * 244;
        const y = startY + row * 114;
        positions.set(node.id, {x, y});
        const button = document.createElement("button");
        const status = statusFor(node);
        button.type = "button";
        button.className = `node ${status}`;
        button.dataset.nodeId = node.id;
        button.style.left = `${x}px`;
        button.style.top = `${y}px`;
        button.setAttribute("aria-label", `${node.name}, ${typeLabel(node.type)}, ${statusLabel(status)}`);
        const name = document.createElement("span");
        name.className = "node-name";
        name.textContent = node.name;
        const type = document.createElement("span");
        type.className = "node-type";
        type.textContent = typeLabel(node.type);
        const state = document.createElement("span");
        state.className = "node-state";
        state.textContent = statusLabel(status);
        button.append(name, type, state);
        button.addEventListener("click", () => selectNode(node.id));
        stage.appendChild(button);
      });
    });

    const edgeSvg = document.getElementById("edges");
    edgeSvg.setAttribute("viewBox", `0 0 ${stageWidth} ${stageHeight}`);
    edgeSvg.innerHTML = `<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#aab7b1"></path></marker><marker id="arrow-active" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#197454"></path></marker></defs>`;
    edges.forEach((edge, index) => {
      const from = positions.get(edge.from);
      const to = positions.get(edge.to);
      if (!from || !to) return;
      const startX = from.x + 190;
      const startY = from.y + 38;
      const endX = to.x;
      const endY = to.y + 38;
      const curve = Math.max(46, (endX - startX) * .48);
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", `M ${startX} ${startY} C ${startX + curve} ${startY}, ${endX - curve} ${endY}, ${endX} ${endY}`);
      path.setAttribute("class", "edge");
      path.setAttribute("marker-end", "url(#arrow)");
      path.dataset.edgeIndex = String(index);
      edgeSvg.appendChild(path);
    });

    const reachableCount = start => {
      const seen = new Set();
      const pending = [start];
      while (pending.length) {
        const current = pending.shift();
        (outgoing.get(current) || []).forEach(next => {
          if (!seen.has(next)) { seen.add(next); pending.push(next); }
        });
      }
      return seen.size;
    };
    const detailSection = (title, content) => `<section class="detail-section"><h3>${escapeHtml(title)}</h3>${content}</section>`;
    const factList = facts => `<dl class="facts">${facts.map(([label, value]) => `<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd>`).join("")}</dl>`;
    const messageList = (items, className = "") => `<ul class="detail-list">${items.map(item => `<li${className ? ` class="${className}"` : ""}>${escapeHtml(item)}</li>`).join("")}</ul>`;

    function inspectorContent(node) {
      const model = modelFor(node);
      const nodeFindings = findingsFor(node);
      const nodeGaps = gapsFor(node);
      const sections = [];
      if (nodeFindings.length) sections.push(detailSection("What changed", messageList(nodeFindings.map(item => item.message), "finding")));
      if (nodeGaps.length) sections.push(detailSection("Not validated", messageList(nodeGaps.map(item => item.reason), "gap")));

      if (model?.comparison) {
        const comparison = model.comparison;
        sections.push(detailSection("Row comparison", factList([
          ["Candidate", formatNumber(comparison.ci_row_count)],
          ["Production", formatNumber(comparison.production_row_count)],
          ["Difference", formatPercent(comparison.row_count_relative_change)]
        ])));
        if (comparison.primary_key) {
          const key = comparison.primary_key;
          sections.push(detailSection("Primary key", factList([
            ["Columns", values(key.columns).join(", ")],
            ["Candidate only", formatNumber(key.ci_only_count)],
            ["Production only", formatNumber(key.production_only_count)],
            ["Duplicate keys", formatNumber(key.ci_duplicate_key_count)],
            ["Null keys", formatNumber(key.ci_null_key_rows)]
          ])));
        }
      } else if (node.type === "query" && node.record) {
        const query = node.record;
        const comparison = query.comparison;
        sections.push(detailSection("Query check", factList([
          ["Status", statusLabel(statusFor(node))],
          ["Primary key", values(query.primary_key).join(", ") || "none"],
          ["Candidate rows", formatNumber(query.candidate_row_count)],
          ["Production rows", formatNumber(query.production_row_count)]
        ])));
        if (comparison) sections.push(detailSection("Differences", factList([
          ["Changed rows", formatNumber(comparison.changed_rows)],
          ["Candidate only", formatNumber(comparison.candidate_only_rows)],
          ["Production only", formatNumber(comparison.production_only_rows)],
          ["Duplicate keys", formatNumber(comparison.candidate_duplicate_keys)]
        ])));
      }

      const flows = columnLineage.filter(edge => edge.from === node.id || edge.to === node.id).slice(0, 8);
      if (flows.length) sections.push(detailSection("Column lineage", `<div class="detail-list">${flows.map(edge => `<div class="flow"><span title="${escapeHtml(`${edge.from_name}.${edge.from_column}`)}">${escapeHtml(`${edge.from_name}.${edge.from_column}`)}</span><b>→</b><span title="${escapeHtml(`${edge.to_name}.${edge.to_column}`)}">${escapeHtml(`${edge.to_name}.${edge.to_column}`)}</span></div>`).join("")}</div>`));

      sections.push(detailSection("Impact", factList([
        ["Direct children", formatNumber((outgoing.get(node.id) || []).length)],
        ["All downstream", formatNumber(reachableCount(node.id))],
        ["Validation", statusLabel(statusFor(node))]
      ])));
      return sections.join("") || `<p class="empty">No comparison evidence is available for this node.</p>`;
    }

    function selectNode(id) {
      selectedId = id;
      const node = nodeMap.get(id);
      document.querySelectorAll(".node").forEach(element => element.classList.toggle("is-selected", element.dataset.nodeId === id));
      document.querySelectorAll(".edge").forEach((element, index) => {
        const edge = edges[index];
        const connected = edge && (edge.from === id || edge.to === id);
        element.classList.toggle("is-connected", connected);
        element.setAttribute("marker-end", connected ? "url(#arrow-active)" : "url(#arrow)");
      });
      document.getElementById("inspector-eyebrow").textContent = `${typeLabel(node.type)} · ${statusLabel(statusFor(node))}`;
      document.getElementById("inspector-title").textContent = node.name;
      document.getElementById("inspector-subtitle").textContent = node.id;
      document.getElementById("inspector-body").innerHTML = inspectorContent(node);
    }

    const initial = nodes.find(node => statusFor(node) === "findings") || nodes[0];
    if (initial) selectNode(initial.id);
    else document.getElementById("inspector-body").innerHTML = `<p class="empty">This report has no lineage nodes.</p>`;
  </script>
</body>
</html>
